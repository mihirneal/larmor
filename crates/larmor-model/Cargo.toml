[package]
name = "larmor-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The encoder runs on Candle. Devices:
# - CPU: always built.
# - Metal (Apple GPUs): always built on macOS, through the target-specific dependencies below.
# - CUDA (NVIDIA GPUs): the `cuda` feature, for Linux.
[features]
default = []
# NVIDIA GPUs. Candle compiles its CUDA kernels at build time, so building with this feature needs
# the CUDA toolkit (`nvcc`) and does not build on macOS. Build with `--features cuda` on Linux.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
safetensors.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
sha2 = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
