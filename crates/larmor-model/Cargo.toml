[package]
name = "larmor-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
safetensors.workspace = true
# The encoder runs on Candle: on the Apple GPU through Metal (the default device), or on the CPU
# (the fallback, and what the tests use).
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
sha2 = "0.11.0"

[dev-dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
