[package]
name = "larmor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MRI foundation-model embeddings and linear probes on a Mac, in one Rust program"

[features]
# NVIDIA GPUs on Linux: `cargo build --release -p larmor --features cuda`
cuda = ["larmor-model/cuda", "larmor-probe/cuda"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
# exact round trips of float64 affines through run.json and the cache metadata
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml.workspace = true
safetensors.workspace = true
half.workspace = true
rayon.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
ureq = "3.5.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
larmor-volume = { path = "../larmor-volume" }
larmor-prep = { path = "../larmor-prep" }
larmor-model = { path = "../larmor-model" }
larmor-probe = { path = "../larmor-probe" }
