[package]
name = "candle-spike"
version = "0.1.0"
edition = "2024"
publish = false
description = "Comparison spike: nanobrain ViT encoder forward pass on Candle (Metal), parity and timing"

# Standalone: not a member of the root Larmor workspace.
[workspace]

[dependencies]
anyhow = "1"
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
debug = 1

# Numeric dependencies are unusably slow unoptimized, even in test builds.
[profile.dev.package."*"]
opt-level = 3
