[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mihirneal/larmor"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
safetensors = "0.8"
half = "2"
rayon = "1"
burn = { version = "0.22.1", default-features = false, features = ["std"] }
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }

[profile.dev]
opt-level = 1

# numeric dependencies are unusably slow unoptimized, even in debug builds
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
